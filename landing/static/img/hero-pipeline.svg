<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" role="img" aria-label="A website goes into a script and comes out as clean data">
  <style>
    .flow { stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>

  <rect width="560" height="420" rx="16" fill="#e3ebe8"/>

  <!-- Node 1: website -->
  <rect x="32" y="120" width="140" height="180" rx="10" fill="#ffffff" stroke="#12303f" stroke-width="2"/>
  <line x1="32" y1="148" x2="172" y2="148" stroke="#12303f" stroke-width="2"/>
  <circle cx="47" cy="134" r="4" fill="#12303f"/>
  <circle cx="59" cy="134" r="4" fill="#12303f"/>
  <circle cx="71" cy="134" r="4" fill="#12303f"/>
  <rect x="48" y="164" width="108" height="10" rx="3" fill="#c9d4d1"/>
  <rect x="48" y="184" width="80" height="10" rx="3" fill="#c9d4d1"/>
  <rect x="48" y="204" width="108" height="10" rx="3" fill="#c9d4d1"/>
  <rect x="48" y="224" width="60" height="10" rx="3" fill="#c9d4d1"/>
  <rect x="48" y="244" width="96" height="10" rx="3" fill="#c9d4d1"/>
  <rect x="48" y="264" width="70" height="10" rx="3" fill="#c9d4d1"/>
  <text x="102" y="340" text-anchor="middle" font-size="22" font-weight="700" fill="#12303f">Website</text>

  <!-- Node 2: script -->
  <rect x="210" y="150" width="140" height="120" rx="10" fill="#12303f"/>
  <text x="280" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#ffd23f">scraper.py</text>
  <rect x="228" y="208" width="60" height="8" rx="3" fill="#5c7886"/>
  <rect x="228" y="226" width="96" height="8" rx="3" fill="#5c7886"/>
  <rect x="228" y="244" width="44" height="8" rx="3" fill="#5c7886"/>
  <text x="280" y="340" text-anchor="middle" font-size="22" font-weight="700" fill="#12303f">Your script</text>

  <!-- Node 3: clean data -->
  <rect x="388" y="120" width="140" height="180" rx="10" fill="#ffffff" stroke="#12303f" stroke-width="2"/>
  <rect x="388" y="120" width="140" height="30" rx="10" fill="#12303f"/>
  <rect x="388" y="140" width="140" height="10" fill="#12303f"/>
  <text x="458" y="141" text-anchor="middle" font-size="16" font-weight="700" fill="#ffd23f">data.csv</text>
  <line x1="388" y1="182" x2="528" y2="182" stroke="#c9d4d1" stroke-width="2"/>
  <line x1="388" y1="214" x2="528" y2="214" stroke="#c9d4d1" stroke-width="2"/>
  <line x1="388" y1="246" x2="528" y2="246" stroke="#c9d4d1" stroke-width="2"/>
  <line x1="388" y1="278" x2="528" y2="278" stroke="#c9d4d1" stroke-width="2"/>
  <line x1="458" y1="150" x2="458" y2="300" stroke="#c9d4d1" stroke-width="2"/>
  <rect x="400" y="162" width="46" height="8" rx="3" fill="#46606d"/>
  <rect x="470" y="162" width="46" height="8" rx="3" fill="#46606d"/>
  <rect x="400" y="194" width="38" height="8" rx="3" fill="#46606d"/>
  <rect x="470" y="194" width="30" height="8" rx="3" fill="#46606d"/>
  <rect x="400" y="226" width="46" height="8" rx="3" fill="#46606d"/>
  <rect x="470" y="226" width="42" height="8" rx="3" fill="#46606d"/>
  <rect x="400" y="258" width="34" height="8" rx="3" fill="#46606d"/>
  <rect x="470" y="258" width="46" height="8" rx="3" fill="#46606d"/>
  <text x="458" y="340" text-anchor="middle" font-size="22" font-weight="700" fill="#12303f">Clean data</text>

  <!-- Connectors -->
  <line class="flow" x1="176" y1="210" x2="200" y2="210" stroke="#12303f" stroke-width="3"/>
  <polygon points="198,202 210,210 198,218" fill="#12303f"/>
  <line class="flow" x1="354" y1="210" x2="378" y2="210" stroke="#12303f" stroke-width="3"/>
  <polygon points="376,202 388,210 376,218" fill="#12303f"/>
</svg>
